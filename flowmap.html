<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ondam · flowmap</title>
<style>
:root{
  --bg:#ffffff; --panel:#fafafa; --line:#e2e2e2; --line-strong:#c8c8c8;
  --fg:#1a1a1a; --muted:#6b6b6b; --faint:#9a9a9a;
  --accent:#2f5fd0; --accent-soft:#eef2fc;
  --get:#2f7d4f; --post:#2f5fd0; --put:#9a6b13; --patch:#9a6b13; --delete:#b03030;
  --warn:#b03030;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#17181a; --panel:#1e1f22; --line:#2e3034; --line-strong:#43464c;
    --fg:#e8e8e8; --muted:#9b9ea4; --faint:#6d7076;
    --accent:#6f96ea; --accent-soft:#232838;
    --get:#5fb37f; --post:#6f96ea; --put:#d4a55c; --patch:#d4a55c; --delete:#e07575;
    --warn:#e07575;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

header{border-bottom:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
header h1{font-size:15px;font-weight:600}
header h1 span{color:var(--muted);font-weight:400}
.stats{display:flex;gap:14px;color:var(--muted);font-size:12.5px;flex-wrap:wrap}
.stats b{color:var(--fg);font-weight:600}
#search{margin-left:auto;border:1px solid var(--line-strong);background:var(--bg);color:var(--fg);
  padding:5px 10px;width:230px;font-size:13px;border-radius:2px}
#search:focus{outline:none;border-color:var(--accent)}

.layout{display:flex;height:calc(100vh - 54px);align-items:stretch}
nav{width:210px;flex:none;border-right:1px solid var(--line);overflow-y:auto;background:var(--panel)}
.nav-title{padding:10px 14px 5px;font-size:11px;letter-spacing:.06em;color:var(--faint);text-transform:uppercase}
.flow-item{display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:6px 14px;cursor:pointer;border-left:2px solid transparent;font-size:13.5px}
.flow-item:hover{background:var(--accent-soft)}
.flow-item.on{border-left-color:var(--accent);background:var(--accent-soft);font-weight:600}
.flow-item i{font-style:normal;color:var(--faint);font-size:12px}
.flow-item.warn span:first-child{color:var(--warn)}

main{flex:1;overflow-y:auto;padding:18px 22px 60px}
h2{font-size:17px;font-weight:600;margin-bottom:2px}
.sub{color:var(--muted);font-size:12.5px;margin-bottom:16px}

.diagram{border:1px solid var(--line);background:var(--panel);margin-bottom:20px;overflow-x:auto}
.diagram svg{display:block;min-width:100%}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;letter-spacing:.04em;
  text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--line-strong)}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--accent-soft)}
.m{font-weight:700;font-size:11.5px;letter-spacing:.03em}
.m.GET{color:var(--get)}.m.POST{color:var(--post)}.m.PUT,.m.PATCH{color:var(--put)}.m.DELETE{color:var(--delete)}
.path{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.tag{display:inline-block;border:1px solid var(--line-strong);color:var(--muted);
  font-size:11px;padding:0 5px;margin:0 3px 2px 0;white-space:nowrap}
.tag.op{border-color:var(--accent);color:var(--accent)}
.lock{color:var(--muted);font-size:11.5px}
.lock.no{color:var(--warn)}
.none{color:var(--faint)}

dialog{border:1px solid var(--line-strong);background:var(--bg);color:var(--fg);
  padding:0;width:min(760px,92vw);max-height:86vh}
dialog::backdrop{background:rgba(0,0,0,.42)}
.mhead{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.mhead .path{font-size:14px}
.mhead .src{margin-left:auto;color:var(--faint);font-size:11.5px}
.mclose{position:absolute;top:10px;right:12px;border:none;background:none;color:var(--muted);
  font-size:20px;cursor:pointer;line-height:1}
.tabs{display:flex;gap:2px;padding:10px 18px 0;border-bottom:1px solid var(--line)}
.tab{border:1px solid transparent;border-bottom:none;background:none;color:var(--muted);
  padding:5px 12px;font-size:13px;cursor:pointer}
.tab.on{border-color:var(--line);background:var(--panel);color:var(--fg);font-weight:600;margin-bottom:-1px}
.mbody{padding:14px 18px 20px;overflow-y:auto;max-height:56vh}
pre{background:var(--panel);border:1px solid var(--line);padding:11px 13px;overflow-x:auto;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.5}
.from{color:var(--faint);font-size:11.5px;margin-top:6px;text-align:right}
.k{color:var(--accent)}.s{color:var(--get)}.n{color:var(--put)}

.finding{border:1px solid var(--line);margin-bottom:14px}
.finding h3{font-size:13.5px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);font-weight:600}
.finding h3 i{font-style:normal;color:var(--muted);font-weight:400}
.finding ul{list-style:none;padding:6px 12px}
.finding li{padding:3px 0;font-size:12.5px;display:flex;gap:10px}
.finding li .src{margin-left:auto;color:var(--faint);font-size:11.5px}
.hint{color:var(--muted);font-size:12.5px;padding:4px 12px 10px;border-top:1px solid var(--line)}
</style>
</head>

</dialog>

function renderNav() {
  let h = '<div class="nav-title">플로우</div>';
  for (const fl of DATA.flows) {
    h += '<div class="flow-item' + (current === fl.id ? ' on' : '') + '" data-id="' + fl.id + '">' +
         '<span>' + esc(fl.label) + '</span><i>' + fl.endpointIds.length + '</i></div>';
  }
  h += '<div class="nav-title" style="margin-top:8px">점검</div>' +
       '<div class="flow-item warn' + (current === '__check' ? ' on' : '') + '" data-id="__check">' +
       '<span>점검 항목</span><i>' + warnTotal + '</i></div>';
  $('nav').innerHTML = h;
  $('nav').querySelectorAll('.flow-item').forEach((el) => {
    el.onclick = () => { current = el.dataset.id; render(); };
  });
}

/* ---------- 다이어그램: 화면 → 플로우 → 테이블 ---------- */
function diagram(flow) {
  const L = flow.pages.slice(0, 8), R = flow.tables.slice(0, 10);
  const rowH = 26, padY = 22;
  const h = Math.max(L.length, R.length, 3) * rowH + padY * 2;
  const cy = h / 2, xL = 150, xM = 400, xR = 640;
  const box = (x, y, w, t, anchor) =>
    '<rect x="' + (x - w / 2) + '" y="' + (y - 10) + '" width="' + w + '" height="20" ' +
    'fill="var(--bg)" stroke="var(--line-strong)"/>' +
    '<text x="' + x + '" y="' + (y + 4) + '" text-anchor="middle" font-size="11.5" ' +
    'fill="var(--fg)" font-family="ui-monospace,Menlo,monospace">' + esc(t) + '</text>';
  const yFor = (i, n) => cy - ((n - 1) * rowH) / 2 + i * rowH;

  let s = '<svg viewBox="0 0 790 ' + h + '" height="' + h + '">';
  s += '<text x="150" y="14" text-anchor="middle" font-size="10.5" fill="var(--faint)">화면</text>';
  s += '<text x="400" y="14" text-anchor="middle" font-size="10.5" fill="var(--faint)">API</text>';
  s += '<text x="640" y="14" text-anchor="middle" font-size="10.5" fill="var(--faint)">DB 테이블</text>';

  L.forEach((p, i) => {
    const y = yFor(i, L.length);
    s += '<path d="M225 ' + y + ' C 290 ' + y + ', 300 ' + cy + ', 335 ' + cy + '" fill="none" stroke="var(--line-strong)"/>';
    s += box(xL, y, 150, p.length > 20 ? p.slice(0, 19) + '…' : p);
  });
  R.forEach((t, i) => {
    const y = yFor(i, R.length);
    s += '<path d="M465 ' + cy + ' C 500 ' + cy + ', 510 ' + y + ', 565 ' + y + '" fill="none" stroke="var(--line-strong)"/>';
    s += box(xR, y, 150, t.length > 20 ? t.slice(0, 19) + '…' : t);
  });
  if (!L.length) s += '<text x="150" y="' + cy + '" text-anchor="middle" font-size="11.5" fill="var(--faint)">호출 화면 미확인</text>';
  if (!R.length) s += '<text x="640" y="' + cy + '" text-anchor="middle" font-size="11.5" fill="var(--faint)">테이블 미확인</text>';

  s += '<rect x="335" y="' + (cy - 16) + '" width="130" height="32" fill="var(--accent-soft)" stroke="var(--accent)"/>';
  s += '<text x="400" y="' + (cy + 5) + '" text-anchor="middle" font-size="12.5" fill="var(--fg)" font-weight="600">' +
       esc(flow.label) + ' · ' + flow.endpointIds.length + '</text>';
  return s + '</svg>';
}

/* ---------- 본문 ---------- */
function epRows(list) {
  if (!list.length) return '<p class="none" style="padding:14px 2px">해당하는 API가 없습니다.</p>';
  let h = '<table><thead><tr><th style="width:62px">메서드</th><th>경로</th>' +
          '<th style="width:120px">인증</th><th style="width:230px">DB 테이블</th>' +
          '<th style="width:150px">호출 화면</th></tr></thead><tbody>';
  for (const e of list) {
    h += '<tr data-id="' + e.id + '">' +
      '<td><span class="m ' + e.method + '">' + e.method + '</span></td>' +
      '<td class="path">' + esc(e.path) + '</td>' +
      '<td class="lock' + (e.auth ? '' : ' no') + '">' + (e.auth ? esc(e.auth) : '없음') + '</td>' +
      '<td>' + (e.touches.length
        ? e.touches.map((t) => '<span class="tag' + (t.ops.some((o) => o !== 'SELECT') ? ' op' : '') + '">' +
            esc(t.table) + '</span>').join('')
        : '<span class="none">-</span>') + '</td>' +
      '<td>' + (e.calledBy.length
        ? e.calledBy.map((p) => '<span class="tag">' + esc(p) + '</span>').join('')
        : '<span class="none">-</span>') + '</td></tr>';
  }
  return h + '</tbody></table>';
}

function renderChecks() {
  const block = (title, why, items, fmt) => {
    if (!items.length) return '';
    return '<div class="finding"><h3>' + title + ' <i>' + items.length + '건</i></h3><ul>' +
      items.slice(0, 40).map(fmt).join('') + '</ul><div class="hint">' + why + '</div></div>';
  };
  const li = (o) => '<li><span class="path">' + esc(o.label) + '</span>' +
    (o.src ? '<span class="src">' + esc(o.src) + '</span>' : '') + '</li>';
  let h = '<h2>점검 항목</h2><div class="sub">그래프 데이터에서 그대로 계산된 것입니다. 별도 분석이 아니라 참고용 신호입니다.</div>';
  h += block('프론트에서 호출되지 않는 API', '만들어두고 화면에서 안 쓰는 엔드포인트일 수 있습니다. 정적 분석 한계로 동적 호출은 못 잡습니다.', f.orphan, li);
  h += block('인증 미들웨어가 없는 API', '공개가 의도된 것인지 확인이 필요합니다.', f.noAuth, li);
  h += block('중복 구현 의심', '같은 메서드로 같은 테이블을 건드리는데 경로가 다릅니다.', f.duplicate,
    (d) => '<li><span class="path">' + esc(d.label) + '</span><span class="src">' +
           d.items.map((i) => esc(i.label)).join('  ·  ') + '</span></li>');
  h += block('어느 API도 쓰지 않는 테이블', '스키마만 있고 코드에서 안 쓰이는 테이블입니다.', f.unusedTables, li);
  if (DATA.unresolved.length) {
    h += block('정적 분석으로 확정 못 한 지점', '이 목록이 곧 이 지도의 사각지대입니다.',
      DATA.unresolved.map((u) => ({ label: u.reason, src: u.src })), li);
  }
  if (h.indexOf('finding') === -1) h += '<p class="none">발견된 항목이 없습니다.</p>';
  return h;
}

function render() {
  renderNav();
  if (query) {
    const q = query.toLowerCase();
    const hits = DATA.endpoints.filter((e) =>
      e.path.toLowerCase().includes(q) || (e.handler || '').toLowerCase().includes(q) ||
      e.touches.some((t) => t.table.includes(q)));
    $('main').innerHTML = '<h2>검색 결과</h2><div class="sub">"' + esc(query) + '" · ' + hits.length + '건</div>' + epRows(hits);
  } else if (current === '__check') {
    $('main').innerHTML = renderChecks();
  } else {
    const flow = DATA.flows.find((x) => x.id === current) || DATA.flows[0];
    if (!flow) { $('main').innerHTML = '<p class="none">플로우가 없습니다.</p>'; return; }
    const list = flow.endpointIds.map((id) => epById[id]);
    $('main').innerHTML =
      '<h2>' + esc(flow.label) + '</h2>' +
      '<div class="sub">API ' + list.length + '개 · 테이블 ' + flow.tables.length +
      '개 · 화면 ' + flow.pages.length + '개</div>' +
      '<div class="diagram">' + diagram(flow) + '</div>' + epRows(list);
  }
  $('main').querySelectorAll('tbody tr').forEach((tr) => {
    tr.onclick = () => openModal(epById[tr.dataset.id]);
  });
}

/* ---------- 모달 ---------- */
function pretty(v) {
  if (v === null || v === undefined) return '<span class="none">예시를 만들 근거가 없습니다.</span>';
  return JSON.stringify(v, null, 2)
    .replace(/[&<>]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))
    .replace(/"([^"]+)":/g, '<span class="k">"$1"</span>:')
    .replace(/: "([^"]*)"/g, ': <span class="s">"$1"</span>')
    .replace(/: (\d+\.?\d*|true|false|null)/g, ': <span class="n">$1</span>');
}

let modalEp = null;
function openModal(e) {
  if (!e) return;
  modalEp = e;
  $('mhead').innerHTML = '<span class="m ' + e.method + '">' + e.method + '</span>' +
    '<span class="path">' + esc(e.path) + '</span>' +
    '<span class="src">' + esc(e.src) + '</span>';
  const tabs = [['req', '요청'], ['res', '응답'], ['db', 'DB'], ['ui', '호출 화면']];
  $('mtabs').innerHTML = tabs.map(([k, t], i) =>
    '<button class="tab' + (i === 0 ? ' on' : '') + '" data-t="' + k + '">' + t + '</button>').join('');
  $('mtabs').querySelectorAll('.tab').forEach((b) => {
    b.onclick = () => {
      $('mtabs').querySelectorAll('.tab').forEach((x) => x.classList.remove('on'));
      b.classList.add('on'); tab(b.dataset.t);
    };
  });
  tab('req');
  $('modal').showModal();
}

function tab(k) {
  const e = modalEp;
  let h = '';
  if (k === 'req') {
    h = e.request
      ? '<pre>' + pretty(e.request.sample) + '</pre><div class="from">출처: ' + esc(e.request.from) + '</div>'
      : '<p class="none">본문 없는 요청입니다 (' + e.method + ').</p>';
  } else if (k === 'res') {
    h = '<pre>' + pretty(e.response.sample) + '</pre><div class="from">출처: ' + esc(e.response.from) + '</div>';
  } else if (k === 'db') {
    h = e.touches.length
      ? '<table><thead><tr><th>테이블</th><th style="width:200px">연산</th></tr></thead><tbody>' +
        e.touches.map((t) => '<tr style="cursor:default"><td class="path">' + esc(t.table) + '</td><td>' +
          t.ops.map((o) => '<span class="tag' + (o !== 'SELECT' ? ' op' : '') + '">' + o + '</span>').join('') +
          '</td></tr>').join('') + '</tbody></table>'
      : '<p class="none">건드리는 테이블을 확정하지 못했습니다.</p>';
  } else {
    h = e.calledBy.length
      ? '<ul style="list-style:none">' + e.calledBy.map((p) => '<li style="padding:3px 0" class="path">' + esc(p) + '</li>').join('') + '</ul>'
      : '<p class="none">이 API를 호출하는 화면을 찾지 못했습니다.</p>';
  }
  h += '<div class="from">핸들러: ' + esc(modalEp.handler || '-') + ' · 인증: ' + esc(modalEp.auth || '없음') + '</div>';
  $('mbody').innerHTML = h;
}

$('search').oninput = (ev) => { query = ev.target.value.trim(); render(); };
document.addEventListener('keydown', (ev) => {
  if (ev.key === '/' && document.activeElement !== $('search')) { ev.preventDefault(); $('search').focus(); }
});
render();
</script>
</body>
</html>
